name: Joint ☑️

on:
    pull_request:
        branches:
            - qa
            - master

permissions:
    contents: read

jobs:
    install-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            
            - name: Setup Node.js
              # Use a stable published version tag to ensure the action can be resolved
              uses: actions/setup-node@v4
              with:
                node-version: '22.x'
                cache: npm
                cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: |
                  npm ci

            - name: Run lint
              run: npm run lint

            - name: Run type checking
              run: npm run type-check

            - name: Build application
              run: npm run build
